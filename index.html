<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>府城寺廟巡禮</title>
<meta name="description" content="用開源地圖認識台南最有名的寺廟">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">⛩ 府城寺廟巡禮</div>
  <nav><a href="#map-section">地圖</a><a href="#about">關於我</a></nav>
</header>

<section class="hero">
  <h1>走進台南的信仰地圖</h1>
  <p>台南是台灣最早開發的城市，廟宇密度冠於全台。點選地圖上的標記，認識每間廟的故事與樣貌。</p>
</section>

<div class="controls"><div id="chips"></div><label class="osm"><input type="checkbox" id="osmToggle"> 顯示全台南市 OSM 寺廟（<span id="osmStatus">未載入</span>）</label></div>
<main id="map-section" class="layout">
  <div id="map" aria-label="台南寺廟地圖"></div>
  <aside id="panel" aria-live="polite">
    <div class="empty">
      <p>👈 點選地圖標記或下方清單，查看寺廟資訊與照片。</p>
      <ul id="list"></ul>
    </div>
  </aside>
</main>



<footer>
  地圖資料 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者 ・ 地圖函式庫 <a href="https://leafletjs.com">Leaflet</a> ・ 照片來自 <a href="https://commons.wikimedia.org">Wikimedia Commons</a>（各照片標示作者與授權）<br>
  標記為概略位置，詳細地址請以 OSM 或實地為準。
</footer>

<div id="lightbox" hidden><img alt=""><button aria-label="關閉">×</button></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="temples.js"></script>
<script src="app.js"></script>
</body>
</html>
